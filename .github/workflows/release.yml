name: Release

# Publishing a GitHub release tagged v<version> publishes graunt to npm and PyPI
# through trusted publishing (OIDC). RELEASING.md has the one-time setup.
#
# The packages are built, installed into clean consumers and tested in `build`,
# which holds no publishing authority. The publish jobs, the only ones with
# id-token: write, run no checkout, no install and no build: each downloads the
# exact files `build` tested and hands them to the registry. Every action is
# pinned to a commit SHA.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The tag names the version all four places declare
        run: |
          set -euo pipefail
          js=$(node -p 'require("./js/package.json").version')
          js_const=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' js/src/version.ts)
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)
          py_const=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/graunt/_version.py)
          echo "tag=${TAG} js=${js} js_const=${js_const} python=${py} python_const=${py_const}"
          if [ "${TAG}" != "v${js}" ] || [ "${js}" != "${js_const}" ] || [ "${js}" != "${py}" ] || [ "${py}" != "${py_const}" ]; then
            echo "::error::the release tag and the four declared versions disagree"
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests and the live quickstart, both clients
        env:
          GRAUNT_LIVE: "1"
        run: |
          set -euo pipefail
          (cd js && npm ci && npm run typecheck && npm test && npm run test:live)
          (cd python && pip install -e '.[test]' && pytest -q)
      - name: Pack the npm tarball
        working-directory: js
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/npm"
          npm pack --pack-destination "${RUNNER_TEMP}/npm"
          ls -l "${RUNNER_TEMP}/npm"
      - name: Build the sdist and wheel with pinned tools
        working-directory: python
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/buildenv"
          "${RUNNER_TEMP}/buildenv/bin/pip" install build==1.6.1 hatchling==1.32.4
          "${RUNNER_TEMP}/buildenv/bin/python" -m build --no-isolation --outdir "${RUNNER_TEMP}/pypi"
          ls -l "${RUNNER_TEMP}/pypi"
      - name: The tarball installs into a clean project and runs the quickstart
        env:
          GRAUNT_LIVE: "1"
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/consumer-js" && cd "${RUNNER_TEMP}/consumer-js"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "${RUNNER_TEMP}"/npm/graunt-*.tgz
          node --input-type=module -e '
            import { Graunt, GrauntError, VERSION } from "graunt";
            const graunt = new Graunt();
            const { listings, pagination } = await graunt.listings.search({ limit: 1 });
            if (!Array.isArray(listings) || typeof pagination.total !== "number") throw new Error("unexpected search shape");
            console.log("esm ok", VERSION, pagination.total, typeof GrauntError);
          '
          node -e 'const { Graunt } = require("graunt"); if (typeof Graunt !== "function") process.exit(1); console.log("require ok");'
      - name: The wheel installs into a clean environment and runs the quickstart
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/consumer-py"
          "${RUNNER_TEMP}/consumer-py/bin/pip" install "${RUNNER_TEMP}"/pypi/graunt-*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/consumer-py/bin/python" -I -c '
          import graunt
          page = graunt.Graunt().listings.search(limit=1)
          assert isinstance(page["listings"], list) and isinstance(page["pagination"]["total"], int)
          print("wheel ok", graunt.__version__, page["pagination"]["total"])
          '
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-dists
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    env:
      # npm cannot attach a trusted publisher to a package that does not exist
      # yet, so the first publish uses a short-lived token (RELEASING.md). With
      # the secret deleted, no token is configured and npm can only use OIDC.
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: The bundled npm supports trusted publishing (11.5.1 or later)
        run: |
          set -euo pipefail
          v=$(npm --version)
          echo "npm ${v}"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "${v}"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-package
          path: dist
      - name: First publish only - authenticate with the bootstrap token
        if: env.HAS_BOOTSTRAP_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
      - name: Publish the tarball the build job tested
        run: npm publish ./dist/graunt-*.tgz --access public --provenance

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-dists
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
