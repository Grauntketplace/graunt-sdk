[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graunt"
version = "0.1.0"
description = "Client for the Graunt API, the marketplace for agent-ready data: search listings, read packet manifests, and use an access pass."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Graunt, Inc." }]
keywords = ["graunt", "agent-ready data", "data marketplace", "datasets", "ai agents", "llm", "provenance", "api client"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://graunt.com"
Source = "https://github.com/Grauntketplace/graunt-sdk"
Issues = "https://github.com/Grauntketplace/graunt-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/graunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
